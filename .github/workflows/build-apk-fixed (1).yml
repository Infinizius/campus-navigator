name: Build Android test APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/build-apk.yml'
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'images/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'

permissions:
  contents: read

jobs:
  build-android:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Show Flutter environment
        run: flutter --version

      # Temporary fixes in the GitHub runner for the unmodified upstream source.
      - name: Fix obsolete win32 dependency (Dart 3.5 compatibility)
        run: |
          printf '\ndependency_overrides:\n  win32: 5.5.5\n' >> pubspec.yaml

      - name: Set Android SDK versions for current plugins
        run: |
          sed -i '/^    compileSdkVersion flutter.compileSdkVersion$/d' android/app/build.gradle
          sed -i '/^        compileSdkVersion 33$/d' android/app/build.gradle
          sed -i 's/^    compileSdkVersion 33$/    compileSdkVersion 34/' android/app/build.gradle
          sed -i 's/^        minSdkVersion 33$/        minSdkVersion 23/' android/app/build.gradle

      - name: Resolve Dart packages
        run: flutter pub get

      - name: Build debug APK (signed with Android debug key)
        run: flutter build apk --debug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-navigator-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
